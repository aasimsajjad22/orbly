name: Docker

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build image
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # BuildKit — needed for the cache mounts and multi-stage features
            # your Dockerfile uses.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build the app image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # Which stage to build.
                  target: app
                  # false on a PR — we are only proving it BUILDS. Pushing to a
                  # registry comes later, once ECR exists.
                  push: false
                  tags: orbly:ci
                  # Cache layers in GitHub's cache. Without this every run
                  # recompiles the PHP extensions from scratch — five minutes
                  # each time.
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build the worker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: worker
                  push: false
                  tags: orbly-worker:ci
                  # Reuses the app layers, so this is nearly instant.
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
