security:
    # How to hash passwords. "auto" picks the best available algorithm
    # (currently bcrypt or argon2id) and can upgrade old hashes later.
    # Laravel equivalent: config/hashing.php
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Where users come from. Doctrine loads App\Entity\User by the property
    # we named in make:user. Laravel equivalent: the "users" provider in auth.php
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Dev toolbar/profiler assets — never authenticate these.
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false

        # --- API firewalls (unchanged) ---
        # These come FIRST because firewall matching stops at the first
        # pattern that matches. If the web firewall were above them, it
        # would swallow /api requests and break the JWT auth.
        login:
            pattern: ^/api/login
            stateless: true          # no session, no cookie
            # Symfony calls this class after the password check. Without this
            # line the checker exists but is never invoked.
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login          # POST here with JSON body
                username_path: email            # which JSON key holds the identifier
                password_path: password         # which JSON key holds the password
                # These two handlers come from Lexik: on success it returns
                # {"token": "..."}, on failure a 401 JSON error.
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Firewall 2: everything else under /api, protected by JWT.
        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Security\UserChecker
            jwt: ~                   # enables Lexik's JWT authenticator

        # --- Web firewall (new) ---
        # No pattern, so it matches everything the firewalls above did not.
        # This is the catch-all and MUST be last.
        web:
            # lazy: only start a session when something actually reads the
            # user. Anonymous page views stay cacheable.
            lazy: true
            provider: app_user_provider

            # SAME checker as the API — so an unverified user cannot log in
            # through the web form either. The Phase 2c gate applies to both
            # entry points for free.
            user_checker: App\Security\UserChecker

            form_login:
                # The route that RENDERS the form.
                login_path: app_login
                # The route the form POSTS to. Same route here: GET shows
                # the form, POST is intercepted by the firewall — exactly
                # like /api/login, where the controller never runs.
                check_path: app_login
                # Field names in the HTML form.
                username_parameter: email
                password_parameter: password
                # Send them here after a successful login.
                default_target_path: app_feed
                # CSRF protection for the login form specifically.
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            # "Remember me" cookie, signed with APP_SECRET.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800   # 1 week

        # Catch-all for anything outside /api (we have no web UI, so it's open).
        main:
            lazy: true
            provider: app_user_provider

    # URL rules, checked top to bottom — first match wins, like Laravel's
    # route middleware but declared centrally.
    access_control:
        - { path: ^/api/login,    roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }   # ← new
        - { path: ^/api/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/resend-verification, roles: PUBLIC_ACCESS }
        # Stripe has no JWT. The signature IS the authentication — which
        # is why parseWebhook() is not optional.
        - { path: ^/api/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        # Web rules
        - { path: ^/login,    roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/verify,   roles: PUBLIC_ACCESS }
        # Everything else in the web UI needs a session.
        - { path: ^/,         roles: IS_AUTHENTICATED_FULLY }

# Speed up the test suite: bcrypt cost 4 instead of the default 13.
# Hashing is deliberately slow in production; in tests it just wastes time.
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
