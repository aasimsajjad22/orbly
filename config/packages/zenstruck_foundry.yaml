when@dev:
    zenstruck_foundry:
        # Use PHP 8.4 lazy objects for auto-refresh instead of the old proxy
        # wrapper. On PHP >= 8.4, leaving this unset is itself deprecated.
        enable_auto_refresh_with_lazy_objects: true

when@test:
    zenstruck_foundry:
        enable_auto_refresh_with_lazy_objects: true
