# Loaded only in the test environment, AFTER services.yaml, so this alias
# overrides the one above. One line, and every test gets the fake.
services:
    App\Security\Google\GoogleIdTokenVerifier: '@App\Security\Google\FakeGoogleIdTokenVerifier'

    # Override the real gateway for tests. Public so tests can pull it out
    # of the container and inspect what was called.
    App\Payment\StripeGateway: '@App\Payment\FakeStripeGateway'

    App\Payment\FakeStripeGateway:
        public: true
