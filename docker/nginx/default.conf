server {
    listen 80;
    server_name _;

    # Symfony's single entry point. Every request that is not a real file
    # ends up in public/index.php.
    root /app/public;

    # Do not advertise the nginx version in headers or error pages.
    server_tokens off;

    # The rewrite that makes Symfony routing work.
    # try_files checks for a real file first, and falls back to index.php
    # so /api/feed reaches Symfony rather than 404ing at the filesystem.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP requests go to FPM. The ^~ prefix stops any other location
    # block matching this path.
    location ~ ^/index\.php(/|$) {
        # "php" is the service name in compose — Docker's internal DNS
        # resolves it to the container's IP. In Kubernetes this becomes
        # the Service name instead.
        fastcgi_pass php:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # SCRIPT_FILENAME must be the path INSIDE the PHP container, not
        # the nginx one. They happen to match here because both mount the
        # app at /app.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Large JWTs and Stripe payloads can exceed the default buffer,
        # which would produce a confusing "upstream sent too big header".
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;

        # internal = this location cannot be reached directly from
        # outside. Stops someone requesting /index.php/foo and bypassing
        # the rewrite rules above.
        internal;
    }

    # Anything else ending in .php is a 404. Without this, an uploaded
    # file called shell.php sitting in public/ would be EXECUTED.
    location ~ \.php$ {
        return 404;
    }

    # Long cache for hashed asset filenames. asset-map:compile puts a
    # content hash in each name, so a changed file gets a new URL and
    # the old one can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Logs to the container's stdout/stderr, which Docker collects.
    # Writing to files inside a container means logs vanish on restart.
    access_log /dev/stdout;
    error_log /dev/stderr;

    client_max_body_size 8M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
