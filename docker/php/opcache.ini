; Opcache compiles PHP to bytecode and keeps it in memory. Without it,
; every request re-parses every file — the single biggest performance
; difference between a dev and a production PHP setup.
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.preload=/app/config/preload.php
opcache.preload_user=www-data
