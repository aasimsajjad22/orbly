[www]
; Listen on TCP rather than a Unix socket, so nginx can be a separate
; container. A socket would require a shared volume.
listen = 0.0.0.0:9000

; Log to the container's stderr rather than a file nobody will read.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; Process management. "dynamic" scales workers with load; the numbers
; want tuning against real memory limits in production.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically. Guards against slow memory leaks in
; long-lived processes.
pm.max_requests = 500

; The endpoint the health check hits.
pm.status_path = /fpm-status
ping.path = /fpm-ping
