# Sensitive values.
#
# IMPORTANT: a Kubernetes Secret is only base64-ENCODED, not encrypted.
# Anyone with read access to the namespace can decode it. It is a
# separate object mainly so access can be restricted with RBAC and so
# secrets do not appear in ConfigMap dumps.
#
# Real production uses AWS Secrets Manager, Vault, or Sealed Secrets —
# Phase 13 covers that. This file has TEST values only and would never
# be committed with real ones.
apiVersion: v1
kind: Secret
metadata:
    name: orbly-secret
    namespace: orbly
type: Opaque

# stringData takes plain text and encodes it for us. The alternative,
# `data:`, requires you to base64 everything by hand.
stringData:
    APP_SECRET: "local-cluster-only-not-a-real-secret"
    JWT_PASSPHRASE: ""
    STRIPE_SECRET_KEY: "sk_test_placeholder"
    STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
    STRIPE_PRO_PRICE_ID: "price_placeholder"
    GOOGLE_CLIENT_ID: "placeholder.apps.googleusercontent.com"
    POSTGRES_PASSWORD: "orbly"
    RABBITMQ_PASSWORD: "orbly"
