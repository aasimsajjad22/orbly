apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: rabbitmq-data
    namespace: orbly
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: rabbitmq
    namespace: orbly
spec:
    serviceName: rabbitmq
    replicas: 1
    selector:
        matchLabels:
            app: rabbitmq
    template:
        metadata:
            labels:
                app: rabbitmq
        spec:
            containers:
                - name: rabbitmq
                  image: rabbitmq:4-management-alpine

                  ports:
                      - containerPort: 5672
                        name: amqp
                      - containerPort: 15672
                        name: management

                  env:
                      - name: RABBITMQ_DEFAULT_USER
                        value: orbly
                      - name: RABBITMQ_DEFAULT_PASS
                        valueFrom:
                            secretKeyRef:
                                name: orbly-secret
                                key: RABBITMQ_PASSWORD

                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/rabbitmq

                  readinessProbe:
                      exec:
                          command: ["rabbitmq-diagnostics", "-q", "ping"]
                      initialDelaySeconds: 20
                      periodSeconds: 10
                      # RabbitMQ is slow to start. A short timeout here produces
                      # spurious failures and a pod that never reports ready.
                      timeoutSeconds: 10

                  livenessProbe:
                      exec:
                          command: ["rabbitmq-diagnostics", "-q", "ping"]
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10

                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"

            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
    name: rabbitmq
    namespace: orbly
spec:
    type: ClusterIP
    selector:
        app: rabbitmq
    ports:
        - name: amqp
          port: 5672
          targetPort: 5672
        - name: management
          port: 15672
          targetPort: 15672
