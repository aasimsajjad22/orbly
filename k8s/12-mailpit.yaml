# No PVC. Mailpit is a local convenience — losing caught emails on a
# restart costs nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: mailpit
    namespace: orbly
spec:
    replicas: 1
    selector:
        matchLabels:
            app: mailpit
    template:
        metadata:
            labels:
                app: mailpit
        spec:
            containers:
                - name: mailpit
                  image: axllent/mailpit:latest
                  ports:
                      - containerPort: 1025
                        name: smtp
                      - containerPort: 8025
                        name: http
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "50m"
                      limits:
                          memory: "128Mi"
                          cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
    name: mailpit
    namespace: orbly
spec:
    type: ClusterIP
    selector:
        app: mailpit
    ports:
        - name: smtp
          port: 1025
          targetPort: 1025
        - name: http
          port: 8025
          targetPort: 8025
