# A ConfigMap can hold whole files. Each key becomes a filename when the
# ConfigMap is mounted as a volume — which is how you get config into a
# stock image without rebuilding it.
apiVersion: v1
kind: ConfigMap
metadata:
    name: nginx-config
    namespace: orbly
data:
    default.conf: |
        server {
            listen 80;
            server_name _;
            root /app/public;
            server_tokens off;

            location / {
                try_files $uri /index.php$is_args$args;
            }

            location ~ ^/index\.php(/|$) {
                # 127.0.0.1, NOT a service name. nginx and php-fpm are two
                # containers in the SAME pod, so they share a network
                # namespace and reach each other on loopback.
                fastcgi_pass 127.0.0.1:9000;

                fastcgi_split_path_info ^(.+\.php)(/.*)$;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                fastcgi_param DOCUMENT_ROOT $realpath_root;
                fastcgi_buffer_size 32k;
                fastcgi_buffers 8 16k;
                internal;
            }

            # Any other .php file is a 404. Without this, a file that ended
            # up in public/ would be EXECUTED.
            location ~ \.php$ {
                return 404;
            }

            location /assets/ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
                try_files $uri =404;
            }

            access_log /dev/stdout;
            error_log /dev/stderr;
            client_max_body_size 8M;
        }
